services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ghg
      POSTGRES_PASSWORD: ghg
      POSTGRES_DB: ghg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghg -d ghg"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://ghg:ghg@db:5432/ghg
      PG_POOL_MAX: "10"
    ports:
      - "3000:3000"

volumes:
  pgdata:
